---

- name: Install prerequisite packages
  apt:
    name:
      - apt-transport-https
      - ca-certificates
      - curl
      - software-properties-common
    state: present
    update_cache: yes
  become: yes

- name: Add Docker GPG key
  apt_key:
    url: https://download.docker.com/linux/ubuntu/gpg
    state: present
  become: yes

- name: Add Docker repository
  apt_repository:
    repo: "deb [arch=amd64] https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable"
    state: present
  become: yes

- name: Install Docker CE
  apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
    state: present
    update_cache: yes
  become: yes

- name: Ensure Docker data directory exists
  file:
    path: /data-disk/docker
    state: directory
    owner: root
    group: root
    mode: "0755"
  become: yes

- name: Create Docker daemon.json with custom data-root
  copy:
    dest: /etc/docker/daemon.json
    content: |
      {
        "data-root": "/data-disk/docker",
        "log-driver": "json-file",
        "log-opts": {
          "max-size": "100m",
          "max-file": "3"
        }
      }
    owner: root
    group: root
    mode: "0644"
  become: yes

- name: Reload systemd and restart Docker
  systemd:
    name: docker
    daemon_reload: yes
    state: restarted
    enabled: yes
  become: yes

- name: Ensure ansible_user can run docker without sudo
  user:
    name: "{{ ansible_user }}"
    groups: docker
    append: yes
  become: yes
