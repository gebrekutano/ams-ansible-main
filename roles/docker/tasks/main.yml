---
- name: Install prerequisite packages
  apt:
    name:
      - ca-certificates
      - curl
      - gnupg
    state: present
    update_cache: yes
  become: yes

- name: Ensure keyrings directory exists
  file:
    path: /etc/apt/keyrings
    state: directory
    mode: "0755"
  become: yes

- name: Download Docker GPG key
  get_url:
    url: https://download.docker.com/linux/ubuntu/gpg
    dest: /etc/apt/keyrings/docker.asc
    mode: "0644"
    force: yes
  become: yes

- name: Add Docker apt repository
  apt_repository:
    # Look closely below: We explicitly reference ansible_facts and sanitize architecture mapping
    repo: >-
      deb [arch={{ 'amd64' if ansible_facts['architecture'] == 'x86_64' else 'arm64' if ansible_facts['architecture'] == 'aarch64' else ansible_facts['architecture'] }} signed-by=/etc/apt/keyrings/docker.asc] 
      https://download.docker.com/linux/ubuntu 
      {{ ansible_facts['distribution_release'] }} 
      stable
    filename: docker
    state: present
    update_cache: yes
  become: yes

- name: Install Docker CE
  apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-buildx-plugin
      - docker-compose-plugin
    state: present
    update_cache: yes  # Ensures the newly added repo lists are actively referenced
  become: yes

- name: Ensure Docker data directory exists
  file:
    path: /data-disk/docker
    state: directory
    owner: root
    group: root
    mode: "0755"
  become: yes

- name: Create Docker daemon.json with custom data-root
  copy:
    dest: /etc/docker/daemon.json
    content: |
      {
        "data-root": "/data-disk/docker",
        "log-driver": "json-file",
        "log-opts": {
          "max-size": "100m",
          "max-file": "3"
        }
      }
    owner: root
    group: root
    mode: "0644"
  become: yes
  notify: Restart Docker

- name: Ensure Docker service is enabled and started
  systemd:
    name: docker
    daemon_reload: yes
    state: started
    enabled: yes
  become: yes

- name: Ensure ansible_user can run docker without sudo
  user:
    name: "{{ ansible_user }}"
    groups: docker
    append: yes
  become: yes
  when: ansible_user != 'root'
